name: 更新 RSS 源

on:
  schedule:
    # 每 2 小时跑一次 (UTC 时间)。GitHub 的定时任务不保证准点, 晚几分钟很正常。
    - cron: "7 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成 RSS
        run: python build.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "内容没有变化, 跳过提交"
          else
            git commit -m "更新 RSS 源 ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi
